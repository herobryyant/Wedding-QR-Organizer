server:
  port: 8080
  error:
    include-message: always
spring:
  application:
    name: wedding-seat-finder-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wedding}
    username: ${DATABASE_USERNAME:wedding}
    password: ${DATABASE_PASSWORD:wedding}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  admin:
    password: ${ADMIN_PASSWORD:change-me-now}
